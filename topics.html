<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<p><a href="exams.html">&larr; Exams</a></p>
<h1 id="tp-title">Topics</h1>
<p class="check-note" id="tp-note">Pick a chapter. Each chapter gets its own circle: one slice per set, dark = mastered topics, light = learning, pale = ready. Tap a slice or a set name to open its topics.</p>
<div id="tp-chapters"></div>
<div id="tp-main" hidden>
<p id="tp-upnext" class="tp-upnext" hidden></p>
<div class="tp-layout">
<div class="tp-piebox">
<svg id="tp-pie" viewBox="0 0 420 420" role="img" aria-label="Chapter topic circle"></svg>
<p class="tp-center-hint">Tap the center to switch: done · mastered · %</p>
</div>
<div id="tp-list" class="tp-list"></div>
</div>
</div>
</main>
<script src="topics.js"></script>
</body>
</html>
